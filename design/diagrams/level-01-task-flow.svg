<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="900" viewBox="0 0 1920 900" role="img" aria-labelledby="t d">
<title id="t">Level 1 "Close the loop" — proposed overlay on the observed First Steps geometry</title>
<desc id="d">Observed solids, spike, spawn and finish from godot/levels/first_steps.json drawn to scale (x2), with proposed task stations A, B, C, a malware patrol, and a vague fork drawn dashed. M-05, M-06, M-07, M-08.</desc>
<rect width="1920" height="900" fill="#faf9f5"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#25354a">
<text x="40" y="50" font-size="30" font-weight="700">Level 1 · Close the loop · task flow over First Steps</text>
<text x="40" y="78" font-size="15" fill="#5b6b7c">scale 2 px per logical px · solid = first_steps.json as shipped · dashed = proposed in this draft, coordinates are placeholders until a route test runs</text>
<!-- world: level is 960 wide, draw at x2 with origin (0,120). y logical 0..430 -> 120..980; we crop to 900 -->
<g transform="translate(0,60) scale(2,1.6)">
<!-- grid hint -->
<g stroke="#e7e5df" stroke-width="0.5">
<path d="M0 80 H960 M0 160 H960 M0 240 H960"/>
</g>
<!-- solids -->
<g fill="#25354a">
<rect x="0" y="320" width="448" height="64"/><rect x="512" y="320" width="224" height="64"/><rect x="784" y="320" width="176" height="64"/>
<rect x="160" y="304" width="48" height="16"/><rect x="576" y="288" width="48" height="32"/>
</g>
<g fill="#438e7d">
<rect x="0" y="320" width="448" height="3"/><rect x="512" y="320" width="224" height="3"/><rect x="784" y="320" width="176" height="3"/><rect x="160" y="304" width="48" height="3"/><rect x="576" y="288" width="48" height="3"/>
</g>
<!-- spike -->
<g fill="#d24e42"><path d="M320 320 L324 304 L328 320 Z M328 320 L332 304 L336 320 Z M336 320 L340 304 L344 320 Z"/></g>
<!-- finish -->
<rect x="916" y="264" width="24" height="56" fill="none" stroke="#287c68" stroke-width="1.5"/>
<path d="M919 320 V250" stroke="#25354a" stroke-width="2"/><path d="M921 250 L936 256 L921 262 Z" fill="#287c68"/>
<!-- spawn / clawd -->
<rect x="55" y="292" width="18" height="28" fill="#dd775b"/>
<!-- fall line -->
<path d="M0 430 H960" stroke="#d24e42" stroke-width="0.8" stroke-dasharray="3 3"/>
<!-- PROPOSED -->
<g stroke="#287c68" stroke-width="1.5" stroke-dasharray="4 3" fill="#fffdf7">
<rect x="172" y="280" width="24" height="24" rx="3"/>
<rect x="588" y="264" width="24" height="24" rx="3"/>
<rect x="840" y="296" width="24" height="24" rx="3"/>
</g>
<!-- malware patrol span -->
<g stroke="#d24e42" stroke-width="1.5" stroke-dasharray="4 3" fill="none">
<path d="M650 310 H730"/><rect x="680" y="300" width="20" height="20" rx="10" fill="#fff0ee"/>
</g>
<!-- vague fork: upper route above the 576 block -->
<g stroke="#5b6b7c" stroke-width="1.5" stroke-dasharray="4 3" fill="none">
<rect x="380" y="220" width="120" height="12"/><rect x="530" y="200" width="80" height="12"/>
<path d="M440 245 V270" /><path d="M448 262 L440 272 L432 262"/>
</g>
<g stroke="#5b6b7c" stroke-width="1.2" fill="#fffdf7"><rect x="392" y="282" width="6" height="38"/><rect x="380" y="270" width="30" height="14" rx="2"/></g>
</g>
<!-- labels (screen space) -->
<g font-size="15">
<text x="110" y="470" fill="#dd775b" font-weight="700">spawn (64,320)</text>
<text x="300" y="440" fill="#287c68" font-weight="700">TASK A</text><text x="300" y="457" fill="#5b6b7c">on the 16 px step · first thing after learning to jump</text>
<text x="560" y="530" fill="#d24e42">bug · M-03 · observed</text>
<text x="700" y="340" fill="#5b6b7c" font-weight="700">vague fork · sign "Up for B"</text><text x="700" y="357" fill="#5b6b7c">both branches go up; the left one dead-ends back to the fork (M-07)</text>
<text x="1160" y="440" fill="#287c68" font-weight="700">TASK B</text><text x="1160" y="457" fill="#5b6b7c">top of the 32 px block · via the fork or the ground</text>
<text x="1290" y="500" fill="#d24e42" font-weight="700">malware patrol · x 650–730</text><text x="1290" y="517" fill="#5b6b7c">contact = death + re-opens B (M-06, Q-01)</text>
<text x="1660" y="440" fill="#287c68" font-weight="700">TASK C</text><text x="1660" y="457" fill="#5b6b7c">after the last gap</text>
<text x="1780" y="400" fill="#287c68" font-weight="700">FINISH</text><text x="1640" y="417" fill="#5b6b7c">soft gate until A, B, C done (M-08)</text>
<text x="40" y="765" fill="#d24e42">fall boundary y=430 · "Missed the landing"</text>
<text x="40" y="820" fill="#5b6b7c">Existing level width 960 gives no room for a real fork; the proposed level extends right of the flag.</text>
<text x="40" y="840" fill="#5b6b7c">Nothing dashed here has been simulated. Route test T-13 covers only the solid geometry.</text>
</g>
</g>
</svg>
