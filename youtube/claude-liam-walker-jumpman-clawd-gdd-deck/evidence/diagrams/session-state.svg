<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="t d">
<title id="t">Session state machine — observed in godot/game/session.gd</title>
<desc id="d">Five states MENU, PLAYING, PAUSED, DYING, COMPLETE with observed transitions solid and proposed ledger and gate behavior dashed. S-01, S-02.</desc>
<rect width="1500" height="720" fill="#faf9f5"/>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#25354a"/></marker>
<marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#287c68"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" fill="#25354a">
<text x="40" y="50" font-size="30" font-weight="700">Session state machine · S-01</text>
<text x="40" y="78" font-size="15" fill="#5b6b7c">solid = session.gd enum (line 13), _unhandled_input, resolve_contacts · dashed = proposed: no new state, a ledger event and a gate condition inside PLAYING</text>
<!-- states -->
<g stroke="#25354a" stroke-width="2.5" fill="#fffdf7">
<ellipse cx="170" cy="380" rx="90" ry="46"/>
<ellipse cx="640" cy="160" rx="90" ry="46"/>
<ellipse cx="640" cy="380" rx="100" ry="46"/>
<ellipse cx="640" cy="600" rx="90" ry="46"/>
<ellipse cx="1200" cy="380" rx="100" ry="46"/>
</g>
<g font-size="20" font-weight="700" text-anchor="middle">
<text x="170" y="387">MENU</text><text x="640" y="167">PAUSED</text><text x="640" y="387">PLAYING</text><text x="640" y="607">DYING</text><text x="1200" y="387">COMPLETE</text>
</g>
<!-- observed transitions -->
<g stroke="#25354a" stroke-width="2" fill="none" marker-end="url(#a)">
<path d="M260 380 H540"/>
<path d="M620 334 V206"/>
<path d="M660 206 V334"/>
<path d="M560 180 Q300 200 210 336"/>
<path d="M620 426 V554"/>
<path d="M660 554 V426"/>
<path d="M740 380 H1100"/>
<path d="M1150 340 Q900 230 730 345"/>
<path d="M1160 424 Q700 700 220 424"/>
</g>
<g font-size="13" fill="#5b6b7c">
<text x="300" y="368">Enter / click → start_session()</text>
<text x="470" y="272">Esc · P · focus lost</text>
<text x="668" y="272">Enter → resume</text>
<text x="300" y="215">M → main menu</text>
<text x="470" y="495">spike · fall · (malware)</text>
<text x="668" y="495">0.55 s → restart_attempt()</text>
<text x="800" y="368">goal contact → COMPLETE</text>
<text x="820" y="255">Enter → replay (deaths reset, ledger reset)</text>
<text x="960" y="545">M → main menu</text>
</g>
<!-- proposed -->
<g stroke="#287c68" stroke-width="2.5" stroke-dasharray="8 6" fill="none" marker-end="url(#g)">
<path d="M560 350 C440 300 440 460 556 412"/>
</g>
<text x="290" y="325" font-size="13" fill="#287c68">station contact → ledger tick (S-02)</text>
<text x="290" y="343" font-size="13" fill="#287c68">stays PLAYING · nod pose</text>
<g stroke="#d24e42" stroke-width="2.5" stroke-dasharray="8 6" fill="none">
<path d="M760 395 H1080"/>
</g>
<text x="780" y="418" font-size="13" fill="#d24e42">proposed gate: task open → HUD "Loop not closed: B open", no transition</text>
<text x="40" y="700" font-size="13" fill="#5b6b7c">Also observed: R restarts from PLAYING, PAUSED or DYING without counting a death (session.gd:175); two contact-snapshot ticks are ignored after respawn (110-112); focus loss pauses only outside test mode.</text>
</g>
</svg>
